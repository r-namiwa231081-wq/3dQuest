<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Study Quest - Epic Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; user-select: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Layer - pointer-events: none to let clicks pass through to the canvas */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Interactive elements within UI layer */
        .interactive-ui { pointer-events: auto; }

        /* 照準 */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); pointer-events: none; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease-out; z-index: 15; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background-color: rgba(255, 255, 255, 1); box-shadow: 0 0 3px rgba(0,0,0,1); }
        #crosshair::before { width: 3px; height: 100%; }
        #crosshair::after { width: 100%; height: 3px; }
        #crosshair.active { transform: translate(-50%, -50%) scale(1.5) rotate(45deg); background-color: rgba(255,50,50,0.5); border-radius: 50%; }

        /* ロビー画面 */
        #lobby-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1e3a8a, #0f172a); display: flex; align-items: center; justify-content: center; z-index: 50; pointer-events: auto; }
        
        /* クエストモーダル */
        #quest-modal-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(5px); z-index: 9999; }

        /* チャットUI */
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 320px; max-height: 250px; display: flex; flex-direction: column; z-index: 20; }
        #chat-messages { flex-grow: 1; overflow-y: auto; background-color: rgba(0,0,0,0.6); border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; backdrop-filter: blur(2px); }
        .chat-message { color: white; font-size: 13px; text-shadow: 1px 1px 1px black; word-wrap: break-word; }
        .chat-message span.author { font-weight: bold; }
        #chat-input-wrapper { display: none; } /* Enterで表示 */

        /* ランキングUI */
        #leaderboard-container { position: absolute; top: 20px; right: 20px; width: 220px; background-color: rgba(0,0,0,0.6); border-radius: 12px; padding: 15px; color: white; z-index: 20; backdrop-filter: blur(3px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* アニメーション */
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .pvp-alert { animation: pulse-red 1s infinite; border: 2px solid red; }
    </style>
</head>
<body>

    <!-- WebGL Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer" style="display: none;">
        <div id="crosshair"></div>
        
        <!-- Player HUD -->
        <div class="absolute top-4 left-4 bg-gray-900/80 p-4 rounded-xl shadow-lg border border-gray-700 interactive-ui min-w-[200px]">
            <div class="text-white font-bold text-lg mb-1" id="hud-name">Player</div>
            <div class="flex items-center gap-3">
                <div class="text-yellow-400 font-extrabold text-xl">Lv. <span id="hud-level">1</span></div>
                <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden">
                    <div id="hud-exp-bar" class="h-full bg-green-500 w-0 transition-all duration-300"></div>
                </div>
            </div>
            <div class="text-gray-300 text-xs mt-1 text-right"><span id="hud-exp">0</span> / <span id="hud-exp-next">100</span> EXP</div>
            <div class="text-gray-400 text-xs mt-2 border-t border-gray-700 pt-2 leading-relaxed">
                [W A S D] 移動 | [Shift] ダッシュ | [Space] ジャンプ<br>
                [左クリック] 魔法 | [F] 飛行切替 | [Q/E] 上下(飛行時)
            </div>
            <div id="flight-badge" class="hidden mt-2 bg-blue-500 text-white text-xs font-bold px-2 py-1 rounded w-max shadow-md tracking-wider">FLYING MODE</div>
        </div>

        <!-- Interaction Hint -->
        <div id="interaction-hint" class="absolute bottom-1/3 left-1/2 transform -translate-x-1/2 text-white font-black text-2xl drop-shadow-[0_2px_2px_rgba(0,0,0,1)] hidden tracking-widest text-red-400">
            [ E ] 敵に挑む
        </div>

        <!-- Leaderboard -->
        <div id="leaderboard-container" class="interactive-ui">
            <h3 class="text-center font-bold text-yellow-400 border-b border-gray-600 pb-2 mb-2 text-sm uppercase tracking-wider">Top Players</h3>
            <ul id="leaderboard-list" class="flex flex-col gap-2 text-sm">
                <!-- JS Inject -->
            </ul>
        </div>

        <!-- Chat -->
        <div id="chat-container" class="interactive-ui">
            <div id="chat-messages"></div>
            <div id="chat-input-wrapper">
                <form id="chat-form" class="flex gap-2">
                    <input type="text" id="chat-input" class="flex-grow bg-white/90 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" placeholder="メッセージ (Enterで送信)" autocomplete="off">
                </form>
            </div>
            <div class="text-white/80 text-xs mt-1 drop-shadow-md font-bold" id="chat-hint">[Enter] でチャット</div>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-md w-full border-4 border-blue-500 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-400 rounded-full opacity-20"></div>
            <h1 class="text-5xl font-black text-blue-700 mb-2 drop-shadow-sm italic">3D STUDY<br>QUEST</h1>
            <p class="text-gray-600 mb-8 font-bold text-sm bg-blue-50 py-1 rounded-full">マルチプレイ・アクションRPG</p>
            
            <div class="mb-5 text-left">
                <label class="block text-gray-700 text-sm font-extrabold mb-2">プレイヤーネーム</label>
                <input type="text" id="lobby-name" class="w-full px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-blue-500 focus:ring-0 transition-colors font-bold text-lg text-center" placeholder="なまえを入力" maxlength="10">
            </div>

            <div class="mb-8 text-left">
                <label class="block text-gray-700 text-sm font-extrabold mb-2">アバターカラー</label>
                <div class="flex justify-between gap-2" id="color-picker">
                    <div class="w-12 h-12 rounded-full bg-red-500 cursor-pointer border-4 border-gray-800 shadow-inner hover:scale-110 transition-transform" data-color="#ef4444"></div>
                    <div class="w-12 h-12 rounded-full bg-blue-500 cursor-pointer border-4 border-transparent hover:border-gray-400 shadow-inner hover:scale-110 transition-transform" data-color="#3b82f6"></div>
                    <div class="w-12 h-12 rounded-full bg-green-500 cursor-pointer border-4 border-transparent hover:border-gray-400 shadow-inner hover:scale-110 transition-transform" data-color="#22c55e"></div>
                    <div class="w-12 h-12 rounded-full bg-yellow-400 cursor-pointer border-4 border-transparent hover:border-gray-400 shadow-inner hover:scale-110 transition-transform" data-color="#facc15"></div>
                    <div class="w-12 h-12 rounded-full bg-purple-500 cursor-pointer border-4 border-transparent hover:border-gray-400 shadow-inner hover:scale-110 transition-transform" data-color="#a855f7"></div>
                </div>
            </div>

            <button id="join-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-xl py-4 px-4 rounded-2xl transition-all transform hover:scale-105 shadow-xl disabled:opacity-50">
                世界にダイブする！
            </button>
        </div>
    </div>

    <!-- Quest (Quiz) Modal -->
    <div id="quest-modal-container">
        <div id="quest-modal-box" class="bg-white p-8 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.5)] max-w-xl w-full transform scale-95 transition-transform duration-200">
            <div class="flex justify-between items-center mb-6 border-b-2 border-gray-100 pb-4">
                <h2 class="text-3xl font-black text-gray-800 flex items-center gap-3">
                    <span id="quest-badge" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm tracking-widest shadow-md">BATTLE</span>
                    <span id="quest-title">モンスターの出題</span>
                </h2>
                <span class="text-sm font-bold text-white bg-gray-800 px-3 py-1 rounded-full" id="quest-subject">算数</span>
            </div>
            
            <p class="text-gray-800 text-xl mb-8 font-bold leading-relaxed whitespace-pre-line bg-gray-50 p-4 rounded-xl border border-gray-200" id="question-text">
                問題文がここに入ります。
            </p>
            
            <div class="grid grid-cols-1 gap-3 mb-6" id="options-container">
                <!-- Options injected by JS -->
            </div>

            <p id="feedback-message" class="text-center font-black text-2xl h-8 mb-4 opacity-0 transition-opacity drop-shadow-sm"></p>
            
            <div class="flex justify-between items-center mt-6">
                <div class="text-sm font-bold text-gray-400" id="quest-timer"></div>
                <button id="flee-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-8 rounded-xl transition-colors shadow-sm">
                    逃げる
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 🔴 Firebase 設定エリア (ここだけ書き換えてください！)
        // ==========================================
        const firebaseConfig = 
           {
  apiKey: "AIzaSyDOQk1zTwmBysmIqITKv3iNalT_DAu0jCw",
  authDomain: "dproject-c8b3f.firebaseapp.com",
  projectId: "dproject-c8b3f",
  storageBucket: "dproject-c8b3f.firebasestorage.app",
  messagingSenderId: "591446674808",
  appId: "1:591446674808:web:80ec3a2c7c1a3454360c8d",
  measurementId: "G-G9J0BL1C4G"
};

        // ★自動的にマルチプレイがオンになるように設定変更済みです
        let app, db, auth, isFirebaseActive = true; 
        
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch(e) {
            console.warn("Firebase Init Error:", e);
        }
        // ==========================================

        let myUserId = null;
        let unsubscribePlayers = null;
        let unsubscribeChat = null;
        let unsubscribeProjectiles = null;

        // --- State Management ---
        const gameState = {
            name: 'Hero',
            color: '#ef4444',
            level: 1,
            exp: 0,
            nextExp: 100,
            inGame: false,
            isQuesting: false,
            chatting: false,
            pvpMode: false,
            isFlying: false
        };

       // --- 問題データ（外部CSVから読み込み） ---
        let questionsData = [
            // 読み込みに失敗した時のための予備問題
            { subject: "エラー", q: "問題データの読み込み中です...", options: ["-", "-", "-"], a: 0 }
        ];

        // CSVファイルを読み込む処理
        Papa.parse("questions.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                questionsData = results.data.map(row => {
                    return {
                        subject: row["教科"],
                        q: row["問題文"],
                        options: [row["選択肢1"], row["選択肢2"], row["選択肢3"]],
                        a: parseInt(row["正解"]) - 1  // 1,2,3をプログラム用の0,1,2に自動変換
                    };
                });
                console.log("問題リストを読み込みました！");
            }
        });

        // --- DOM Elements ---
        const ui = {
            lobby: document.getElementById('lobby-screen'),
            joinBtn: document.getElementById('join-btn'),
            nameInput: document.getElementById('lobby-name'),
            layer: document.getElementById('ui-layer'),
            hudName: document.getElementById('hud-name'),
            hudLevel: document.getElementById('hud-level'),
            hudExp: document.getElementById('hud-exp'),
            hudExpNext: document.getElementById('hud-exp-next'),
            hudExpBar: document.getElementById('hud-exp-bar'),
            hint: document.getElementById('interaction-hint'),
            crosshair: document.getElementById('crosshair'),
            questModal: document.getElementById('quest-modal-container'),
            questBox: document.getElementById('quest-modal-box'),
            qTitle: document.getElementById('quest-title'),
            qSubject: document.getElementById('quest-subject'),
            qText: document.getElementById('question-text'),
            qOptions: document.getElementById('options-container'),
            qFeedback: document.getElementById('feedback-message'),
            qBadge: document.getElementById('quest-badge'),
            fleeBtn: document.getElementById('flee-btn'),
            leaderboard: document.getElementById('leaderboard-list'),
            leaderboardContainer: document.getElementById('leaderboard-container'),
            chatInputWrapper: document.getElementById('chat-input-wrapper'),
            chatInput: document.getElementById('chat-input'),
            chatMessages: document.getElementById('chat-messages'),
            chatHint: document.getElementById('chat-hint'),
            chatForm: document.getElementById('chat-form'),
            flightBadge: document.getElementById('flight-badge')
        };

        // Color Picker Logic
        document.querySelectorAll('#color-picker div').forEach(el => {
            el.addEventListener('click', (e) => {
                document.querySelectorAll('#color-picker div').forEach(d => {
                    d.classList.remove('border-gray-800');
                    d.classList.add('border-transparent');
                });
                e.target.classList.remove('border-transparent');
                e.target.classList.add('border-gray-800');
                gameState.color = e.target.getAttribute('data-color');
            });
        });

        // --- Three.js Setup & Realistic Environment ---
        const scene = new THREE.Scene();
        let timeOfDay = 0;
        
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        const d = 80;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        const controls = new THREE.PointerLockControls(camera, renderer.domElement);
        camera.position.set(0, 1.6, 0);
// --- 3Dモデル（建物の読み込み） ---
        const loader = new THREE.GLTFLoader();
        
        // 試しに「castle.glb」というお城のファイルを読み込む設定
        loader.load(
            'castle.glb', // ← 後でGitHubにアップロードするファイル名
            function (gltf) {
                const model = gltf.scene;
                // 大きさを調整
                model.scale.set(1, 1, 1); 
                // 置く場所を調整 (x, y, z)
                model.position.set(0, 0, -100); 
                
              
                scene.add(model);
            }
        );
        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.fillStyle = '#444';
            context.fillRect(0, 0, 128, 128);
            context.fillStyle = '#88ccff';
            for(let y=10; y<128; y+=20) {
                for(let x=10; x<128; x+=20) {
                    if(Math.random() > 0.3) context.fillRect(x, y, 10, 15);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }
        const buildingTex = createBuildingTexture();

        function generateWorld() {
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b5e2b, roughness: 0.8, metalness: 0.1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const buildingMats = [
                new THREE.MeshStandardMaterial({ color: 0x999999, map: buildingTex, roughness: 0.7 }),
                new THREE.MeshStandardMaterial({ color: 0x778899, map: buildingTex, roughness: 0.7 }),
                new THREE.MeshStandardMaterial({ color: 0xaa9988, map: buildingTex, roughness: 0.7 })
            ];

            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const leavesGeo = new THREE.ConeGeometry(2, 4, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });

            for (let i = 0; i < 30; i++) {
                const x = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;
                
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;

                if (Math.random() > 0.4) {
                    const height = 10 + Math.random() * 40;
                    const w = 8 + Math.random() * 10;
                    const d = 8 + Math.random() * 10;
                    const geo = new THREE.BoxGeometry(w, height, d);
                    
                    const mat = buildingMats[Math.floor(Math.random() * buildingMats.length)].clone();
                    mat.map = mat.map.clone();
                    mat.map.repeat.set(w/10, height/10);

                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, height / 2, z);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                } else {
                    const treeGroup = new THREE.Group();
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.y = 1;
                    trunk.castShadow = true;
                    trunk.receiveShadow = true;
                    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                    leaves.position.y = 3.5;
                    leaves.castShadow = true;
                    leaves.receiveShadow = true;
                    treeGroup.add(trunk);
                    treeGroup.add(leaves);
                    treeGroup.position.set(x, 0, z);
                    
                    const scale = 0.8 + Math.random() * 0.8;
                    treeGroup.scale.set(scale, scale, scale);
                    scene.add(treeGroup);
                }
            }
        }
        generateWorld();

        const enemies = [];
        
        function createSlimeMesh() {
            const group = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(1.2, 16, 16);
            bodyGeo.scale(1, 0.8, 1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.9 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            
            const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.4, 1.3, 1.0);
            const leftPupil = new THREE.Mesh(eyeGeo, pupilMat);
            leftPupil.scale.set(0.5, 0.5, 0.5);
            leftPupil.position.set(-0.4, 1.3, 1.15);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.4, 1.3, 1.0);
            const rightPupil = new THREE.Mesh(eyeGeo, pupilMat);
            rightPupil.scale.set(0.5, 0.5, 0.5);
            rightPupil.position.set(0.4, 1.3, 1.15);

            group.add(body, leftEye, leftPupil, rightEye, rightPupil);
            return group;
        }

        let questionQueue = [];
        function getNextQuestion() {
            if (questionQueue.length === 0) {
                questionQueue = [...questionsData].sort(() => Math.random() - 0.5);
            }
            return questionQueue.pop();
        }

        function spawnEnemy(x, z) {
            const mesh = createSlimeMesh();
            mesh.position.set(x, 0, z);
            scene.add(mesh);
            enemies.push({ mesh: mesh, offset: Math.random() * 10, type: 'npc' });
        }

        for(let i=0; i<20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 20 + Math.random() * 40;
            spawnEnemy(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }

        const remotePlayers = {}; 
        
        function createPlayerLabel(name, level) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.roundRect(10, 10, 236, 100, 20);
            ctx.fill();
            
            ctx.fillStyle = '#facc15'; 
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`Lv.${level}`, 128, 50);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText(name, 128, 95);
            
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false }); 
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(3, 1.5, 1);
            sprite.position.y = 2.8;
            return sprite;
        }

        function createPlayerMesh(colorStr, name, level) {
            const group = new THREE.Group();
            
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(colorStr), roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.SphereGeometry(0.45, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffddaa, roughness: 0.4 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.8;
            head.castShadow = true;
            group.add(head);

            const visorGeo = new THREE.BoxGeometry(0.6, 0.2, 0.3);
            const visorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.85, 0.35);
            group.add(visor);

            const label = createPlayerLabel(name, level);
            group.add(label);

            return { group, labelSprite: label };
        }

        function showSystemNotification(msg) {
            const notif = document.createElement('div');
            notif.className = 'absolute top-20 left-1/2 transform -translate-x-1/2 bg-red-600/90 text-white px-6 py-4 rounded-xl shadow-2xl font-bold text-sm z-[9999] text-center whitespace-pre-line border-2 border-red-400 pointer-events-none';
            notif.innerText = msg;
            document.body.appendChild(notif);
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transition = 'opacity 1s ease-out';
                setTimeout(() => notif.remove(), 1000);
            }, 6000);
        }

        function joinGame() {
            const nameVal = ui.nameInput.value.trim();
            gameState.name = nameVal || 'Player' + Math.floor(Math.random() * 1000);
            
            ui.lobby.style.display = 'none';
            ui.layer.style.display = 'block';
            ui.hudName.innerText = gameState.name;
            updateHUD();

            // ★超重要修正★：ブラウザにブロックされないよう、ボタンクリックと同時に即座に視点ロックを実行する
            controls.lock();
            gameState.inGame = true;

            if (isFirebaseActive && auth) {
                // 非同期（バックグラウンド）でFirebaseに接続して通信を開始する
                signInAnonymously(auth).then((userCredential) => {
                    myUserId = userCredential.user.uid;
                    
                    setDoc(doc(db, "players", myUserId), {
                        name: gameState.name,
                        color: gameState.color,
                        level: gameState.level,
                        x: camera.position.x,
                        y: camera.position.y,
                        z: camera.position.z,
                        ry: camera.rotation.y,
                        lastActive: Date.now()
                    });

                    unsubscribePlayers = onSnapshot(collection(db, "players"), (snapshot) => {
                        const activeIds = new Set();
                        let leaderboardData = [];

                        snapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            const id = docSnap.id;
                            
                            if (Date.now() - data.lastActive > 600000) return;
                            
                            if (id !== myUserId) {
                                activeIds.add(id);
                                if (!remotePlayers[id]) {
                                    const { group, labelSprite } = createPlayerMesh(data.color, data.name, data.level);
                                    scene.add(group);
                                    remotePlayers[id] = { group, labelSprite, targetPos: new THREE.Vector3(), targetRotY: 0 };
                                }
                                remotePlayers[id].targetPos.set(data.x, data.y, data.z);
                                remotePlayers[id].targetRotY = data.ry;
                            }
                            leaderboardData.push({ name: data.name, level: data.level });
                        });

                        Object.keys(remotePlayers).forEach(id => {
                            if (!activeIds.has(id)) {
                                scene.remove(remotePlayers[id].group);
                                delete remotePlayers[id];
                            }
                        });

                        leaderboardData.sort((a, b) => b.level - a.level);
                        ui.leaderboard.innerHTML = leaderboardData.slice(0, 5).map((p, i) => 
                            `<li class="flex justify-between items-center bg-gray-800/50 p-1 px-2 rounded">
                                <span><span class="text-gray-400 mr-2">${i+1}.</span>${p.name}</span>
                                <span class="font-bold text-yellow-400">Lv.${p.level}</span>
                            </li>`
                        ).join('');
                    }, (error) => {
                        console.warn("Firebase Snapshot Error:", error.message);
                        if(isFirebaseActive) {
                            showSystemNotification("エラー: データベース接続に失敗しました。\nオフラインモードで続行します。");
                            isFirebaseActive = false;
                        }
                    });

                    const chatQuery = query(collection(db, "chat"));
                    unsubscribeChat = onSnapshot(chatQuery, (snapshot) => {
                        snapshot.docChanges().forEach((change) => {
                            if (change.type === "added") {
                                const data = change.doc.data();
                                const msgEl = document.createElement('div');
                                msgEl.className = 'chat-message';
                                msgEl.innerHTML = `<span class="author" style="color: ${data.color}">${data.name}:</span> ${data.text}`;
                                ui.chatMessages.appendChild(msgEl);
                                ui.chatMessages.scrollTop = ui.chatMessages.scrollHeight;
                            }
                        });
                    });

                    unsubscribeProjectiles = onSnapshot(collection(db, "attacks"), (snapshot) => {
                         snapshot.docChanges().forEach((change) => {
                             if(change.type === "added") {
                                 const data = change.doc.data();
                                 if(data.targetId === myUserId) {
                                     triggerDefenseQuiz(data.attackerName);
                                     deleteDoc(doc(db, "attacks", change.doc.id)).catch(()=>{});
                                 }
                             }
                         });
                    });

                }).catch((e) => {
                    console.warn("Firebase Login Error:", e.message);
                    showSystemNotification("データベース権限エラーが発生しました。\n(※Firestoreのセキュリティルールを確認してください)\nオフラインモードで開始します。");
                    isFirebaseActive = false;
                });
            }
        }

        ui.joinBtn.addEventListener('click', joinGame);

        // --- Controls & Logic ---
        const moveState = { forward: false, backward: false, left: false, right: false, jump: false, sprint: false, up: false, down: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let canJump = false;

        function resetMovement() {
            moveState.forward = false; moveState.backward = false;
            moveState.left = false; moveState.right = false;
            moveState.sprint = false; moveState.up = false; moveState.down = false;
        }
        window.addEventListener('blur', resetMovement);

        document.addEventListener('keydown', (e) => {
            if (!gameState.inGame || gameState.isQuesting || gameState.chatting) return;
            switch (e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'Space': 
                    if (canJump && !gameState.isFlying) velocity.y += 25; 
                    canJump = false; 
                    break;
                case 'ShiftLeft': moveState.sprint = true; break;
                case 'KeyF':
                    gameState.isFlying = !gameState.isFlying;
                    ui.flightBadge.style.display = gameState.isFlying ? 'block' : 'none';
                    if (gameState.isFlying) velocity.y = 0;
                    break;
                case 'KeyQ': if(gameState.isFlying) moveState.down = true; break;
                case 'KeyE': if(gameState.isFlying) moveState.up = true; break;
                case 'Enter': 
                    gameState.chatting = true;
                    controls.unlock();
                    ui.chatInputWrapper.style.display = 'block';
                    ui.chatHint.style.display = 'none';
                    ui.chatInput.focus();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
                case 'ShiftLeft': moveState.sprint = false; break;
                case 'KeyQ': moveState.down = false; break;
                case 'KeyE': moveState.up = false; break;
            }
        });

        ui.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = ui.chatInput.value.trim();
            if (text && isFirebaseActive) {
                await addDoc(collection(db, "chat"), {
                    name: gameState.name,
                    color: gameState.color,
                    text: text,
                    timestamp: Date.now()
                });
            }
            ui.chatInput.value = '';
            ui.chatInputWrapper.style.display = 'none';
            ui.chatHint.style.display = 'block';
            gameState.chatting = false;
            if (!gameState.isQuesting) {
                setTimeout(() => controls.lock(), 100);
            }
        });

        controls.addEventListener('lock', () => { 
            if(gameState.inGame && !gameState.isQuesting && !gameState.chatting) {
                ui.crosshair.style.display = 'flex'; 
            }
        });
        
        controls.addEventListener('unlock', () => { 
            ui.crosshair.style.display = 'none'; 
            resetMovement(); 
        });

        document.getElementById('game-container').addEventListener('mousedown', () => {
            if (gameState.inGame && !gameState.isQuesting && !gameState.chatting) {
                controls.lock();
            }
        });

        const raycaster = new THREE.Raycaster();
        const projectiles = [];
        const projGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const projMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        function shootMagic() {
            const sphere = new THREE.Mesh(projGeo, projMat);
            sphere.position.copy(camera.position);
            
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            scene.add(sphere);
            projectiles.push({ mesh: sphere, velocity: dir.multiplyScalar(50), life: 2.0 });
            
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const npcMeshes = enemies.map(e => e.mesh);
            const npcHits = raycaster.intersectObjects(npcMeshes, true);
            if (npcHits.length > 0 && npcHits[0].distance < 20) {
                let hitMesh = npcHits[0].object;
                while(hitMesh.parent && hitMesh.parent.type === "Group") hitMesh = hitMesh.parent;
                const enemyData = enemies.find(e => e.mesh === hitMesh);
                if (enemyData) {
                    startQuest(getNextQuestion());
                    return; 
                }
            }
            
            if (isFirebaseActive) {
                const playerGroups = Object.values(remotePlayers).map(p => p.group);
                const playerHits = raycaster.intersectObjects(playerGroups, true);
                if (playerHits.length > 0 && playerHits[0].distance < 20) {
                    let hitMesh = playerHits[0].object;
                    while(hitMesh.parent && hitMesh.parent.type === "Group") hitMesh = hitMesh.parent;
                    
                    for (const [id, pData] of Object.entries(remotePlayers)) {
                        if (pData.group === hitMesh) {
                            addDoc(collection(db, "attacks"), {
                                targetId: id,
                                attackerName: gameState.name,
                                timestamp: Date.now()
                            });
                            break;
                        }
                    }
                }
            }
        }

        document.addEventListener('mousedown', (e) => {
            if (!gameState.inGame || gameState.isQuesting || gameState.chatting) return;
            if (e.button === 0 && controls.isLocked) {
                shootMagic();
                ui.crosshair.classList.add('active');
                setTimeout(() => ui.crosshair.classList.remove('active'), 200);
            }
        });

        function startQuest(questionData, isPvP = false) {
            gameState.isQuesting = true;
            gameState.pvpMode = isPvP;
            
            controls.unlock();
            
            ui.questModal.style.display = 'flex';
            ui.qBadge.innerText = isPvP ? 'PvP DEFENSE' : 'BATTLE';
            ui.qBadge.className = isPvP ? 'bg-purple-600 text-white px-3 py-1 rounded-lg text-sm tracking-widest shadow-md' : 'bg-red-500 text-white px-3 py-1 rounded-lg text-sm tracking-widest shadow-md';
            ui.qTitle.innerText = isPvP ? 'ライバルからの攻撃！' : 'モンスターの出題';
            ui.qSubject.innerText = isPvP ? 'ランダム' : questionData.subject;
            ui.qText.innerText = questionData.q;
            
            ui.qOptions.innerHTML = '';
            ui.qFeedback.style.opacity = '0';
            
            if (isPvP) {
                document.body.classList.add('pvp-alert');
            }
            
            questionData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 text-blue-900 font-bold py-4 px-6 rounded-xl text-left transition-colors text-lg flex items-center gap-4';
                btn.innerHTML = `<span class="bg-white text-blue-500 rounded-full w-8 h-8 flex items-center justify-center shadow-sm border border-blue-100">${idx+1}</span> ${opt}`;
                
                btn.onpointerdown = (e) => {
                    e.preventDefault();
                    handleAnswer(idx === questionData.a);
                };
                ui.qOptions.appendChild(btn);
            });
        }

        function triggerDefenseQuiz(attackerName) {
            if(gameState.isQuesting) return;
            startQuest(getNextQuestion(), true);
        }

        function handleAnswer(isCorrect) {
            if (isCorrect) {
                ui.qFeedback.innerText = '正解！！';
                ui.qFeedback.className = 'text-center font-black text-3xl h-8 mb-4 opacity-100 transition-opacity drop-shadow-sm text-green-500';
                
                const expGain = gameState.pvpMode ? 50 : 30;
                gameState.exp += expGain;
                if (gameState.exp >= gameState.nextExp) {
                    gameState.level++;
                    gameState.exp -= gameState.nextExp;
                    gameState.nextExp = Math.floor(gameState.nextExp * 1.5);
                    ui.hudLevel.classList.add('animate-ping');
                    setTimeout(() => ui.hudLevel.classList.remove('animate-ping'), 1000);
                }
                updateHUD();
            } else {
                ui.qFeedback.innerText = '不正解...';
                ui.qFeedback.className = 'text-center font-black text-3xl h-8 mb-4 opacity-100 transition-opacity drop-shadow-sm text-red-500';
            }
            
            setTimeout(() => {
                closeQuest();
            }, 1000);
        }

        function closeQuest() {
            ui.questModal.style.display = 'none';
            gameState.isQuesting = false;
            document.body.classList.remove('pvp-alert');
            
            ui.crosshair.style.display = 'flex';
        }
        
        ui.fleeBtn.onpointerdown = (e) => {
            e.preventDefault();
            closeQuest();
        };

        function updateHUD() {
            ui.hudLevel.innerText = gameState.level;
            ui.hudExp.innerText = gameState.exp;
            ui.hudExpNext.innerText = gameState.nextExp;
            const pct = (gameState.exp / gameState.nextExp) * 100;
            ui.hudExpBar.style.width = `${pct}%`;
        }

        const clock = new THREE.Clock();
        let lastFirebaseUpdate = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            
            // モンスターのアニメーション
            enemies.forEach(e => {
                if(e.mesh.parent) {
                    e.mesh.position.y = Math.abs(Math.sin(clock.getElapsedTime() * 3 + e.offset)) * 1.5;
                }
            });

            // 魔法の弾（プロジェクタイル）のアニメーション
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.addScaledVector(p.velocity, delta);
                p.life -= delta;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
            
            // 他プレイヤーのアニメーション（位置と回転を滑らかに補間）
            Object.values(remotePlayers).forEach(p => {
                p.group.position.lerp(p.targetPos, 0.1);
                let diff = p.targetRotY - p.group.rotation.y;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                p.group.rotation.y += diff * 0.1;
            });

            // プレイヤーの移動制御（視点ロック時のみ）
            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                
                if (!gameState.isFlying) {
                    velocity.y -= 9.8 * 10.0 * delta;
                } else {
                    velocity.y -= velocity.y * 10.0 * delta;
                    if (moveState.up) velocity.y += 40.0 * delta;
                    if (moveState.down) velocity.y -= 40.0 * delta;
                }

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize(); 
                
                const currentSpeed = moveState.sprint ? (gameState.isFlying ? 120.0 : 80.0) : (gameState.isFlying ? 60.0 : 40.0);
                if (moveState.forward || moveState.backward) velocity.z -= direction.z * currentSpeed * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * currentSpeed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < 1.6) {
                    velocity.y = 0;
                    controls.getObject().position.y = 1.6;
                    canJump = true;
                } else if (!gameState.isFlying) {
                    canJump = false;
                }

                // Firebaseへ自分の位置を送信（100ms毎）
                if (isFirebaseActive && myUserId && Date.now() - lastFirebaseUpdate > 100) {
                    setDoc(doc(db, "players", myUserId), {
                        name: gameState.name, color: gameState.color, level: gameState.level,
                        x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: camera.rotation.y, lastActive: Date.now()
                    }, { merge: true }).catch(()=>{});
                    lastFirebaseUpdate = Date.now();
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
